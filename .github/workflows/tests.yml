name: Automated Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up OpenJDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Sample Data & Train Models
      run: |
        python data/generate_dataset.py
        python spark/bronze_ingestion.py
        python spark/silver_transformation.py
        python spark/gold_aggregations.py
        python spark/feature_store.py
        python warehouse/loader.py
        python ml/train.py
        python reports/generator.py

    - name: Execute Pytest Test Suite
      run: |
        export PYTHONPATH=.
        pytest --maxfail=1 --disable-warnings -v
