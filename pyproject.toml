[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosight"
version = "1.0.0"
description = "AeroSight — End-to-End Airline Operations Intelligence & Data Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "AeroSight Team", email = "engineering@aerosight.io"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "joblib>=1.4.0",
    "duckdb>=1.1.0",
    "openpyxl>=3.1.5",
    "pyarrow>=17.0.0",
    "pyspark>=3.5.0",
    "delta-spark>=3.2.0",
    "requests>=2.32.0",
    "tabulate>=0.9.0",
    "kafka-python-ng>=2.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "python-dotenv>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "frontend", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W293", "W291", "F841"]

[tool.ruff.lint.per-file-ignores]
"databricks/notebooks/*" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
